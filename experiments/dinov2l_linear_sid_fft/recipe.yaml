# 2026-08-30, tianqi, log-FFT SID input, frozen DINOv2 linear, clean (feat cache)
name: dinov2l_linear_sid_fft
description: SID_Set (label 0/1 only), frozen DINOv2-L, log-FFT magnitude, clean.
owner: kiki

backbone: dinov2-vit-large-patch14
head: linear
freeze_backbone: true
input_mode: fft

train:
  datasets:
    - sid_set
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val

aug:
  online: false

optim:
  epochs: 3
  batch_size: 32
  head_batch_size: 8192
  cache_features: true
  lr: 0.001
  num_workers: 4

gpu: "1"
# end
