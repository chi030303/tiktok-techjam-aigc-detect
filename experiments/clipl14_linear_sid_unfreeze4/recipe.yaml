# 2026-08-31, tianqi, CLIP-L last-4 unfreeze, same SID+online-aug protocol as CLIP-B unfreeze4
name: clipl14_linear_sid_unfreeze4
description: SID 14万 + online aug, unfreeze last 4 CLIP-L/14 vision blocks. Eval 400 + EvalGEN full.
owner: kiki

backbone: clip-vit-large-patch14
head: linear
freeze_backbone: false
input_mode: rgb

partial_unfreeze:
  n_layers: 4
  backbone_lr: 0.00001
  head_lr: 0.001

train:
  datasets:
    - sid_set
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val
  - evalgen

aug:
  online: true
  jpeg: true
  blur: true
  resize: true
  noise: true
  jitter: true
  center_crop: true

optim:
  epochs: 3
  batch_size: 16
  num_workers: 4
  seed: 20260831

gpu: "1"
# end
