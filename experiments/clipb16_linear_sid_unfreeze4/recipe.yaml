# 2026-08-30, yun, Exp1b ablation vs clipb16_linear_sid_aug baseline: unfreeze last 4 vision blocks
name: clipb16_linear_sid_unfreeze4
description: Same as clipb16_linear_sid_unfreeze2 but unfreezing the last 4 CLIP-B/16 vision blocks (+final LN) instead of 2.
owner: yun

backbone: clip-vit-base-patch16
head: linear
freeze_backbone: false
input_mode: rgb

partial_unfreeze:
  n_layers: 4
  backbone_lr: 0.00001
  head_lr: 0.001

train:
  datasets:
    - sid_set
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val

aug:
  online: true
  jpeg: true
  blur: true
  resize: true
  noise: true
  jitter: true
  center_crop: true

optim:
  epochs: 3
  batch_size: 64
  num_workers: 4

gpu: "1"
