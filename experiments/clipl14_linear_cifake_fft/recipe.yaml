# 2026-08-30, tianqi, log-FFT spectrum as input to frozen CLIP-L/14 on CIFAKE
name: clipl14_linear_cifake_fft
description: Frozen CLIP ViT-L/14 linear head; images converted to log-FFT magnitude.
owner: kiki

backbone: clip-vit-large-patch14
head: linear
freeze_backbone: true
input_mode: fft

train:
  datasets:
    - cifake
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - cifake_test

aug:
  online: false

optim:
  epochs: 3
  batch_size: 64
  head_batch_size: 8192
  cache_features: true
  lr: 0.001
  num_workers: 8

gpu: "1"
# end
