# 2026-08-29, tianqi, CIFAKE + online TechJam aug (do not pre-generate train variants)
name: dinov2l_linear_cifake_aug
description: Full CIFAKE, frozen DINOv2-L, online random official transforms on train.
owner: kiki

backbone: dinov2-vit-large-patch14
head: linear
freeze_backbone: true

train:
  datasets:
    - cifake
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - cifake_test

aug:
  online: true
  jpeg: true
  blur: true
  resize: true
  noise: true
  jitter: true
  center_crop: true

optim:
  epochs: 3
  batch_size: 64
  lr: 0.001
  num_workers: 8
  cache_features: false

gpu: "1"
# end
