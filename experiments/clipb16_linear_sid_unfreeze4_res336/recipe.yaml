# 2026-08-31, tianqi, combine the two gains: unfreeze4 + 336 (dualbranch/consistency did not help)
name: clipb16_linear_sid_unfreeze4_res336
description: CLIP-B last-4 unfreeze at 336. Same SID + online aug as unfreeze4.
owner: kiki

backbone: clip-vit-base-patch16
head: linear
freeze_backbone: false
input_mode: rgb
image_size: 336

partial_unfreeze:
  n_layers: 4
  backbone_lr: 0.00001
  head_lr: 0.001

train:
  datasets:
    - sid_set
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val
  - evalgen

aug:
  online: true
  jpeg: true
  blur: true
  resize: true
  noise: true
  jitter: true
  center_crop: true

optim:
  epochs: 3
  batch_size: 8
  num_workers: 4
  seed: 20260831
# end
