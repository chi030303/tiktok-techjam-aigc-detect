# 2026-08-29, tianqi, MLP encoder on frozen DINOv2 CIFAKE feats (no online aug, uses feat cache)
name: dinov2l_linear_cifake_mlp
description: Frozen DINOv2-L + 256-d MLP head on clean CIFAKE.
owner: kiki

backbone: dinov2-vit-large-patch14
head: mlp
freeze_backbone: true
input_mode: rgb

train:
  datasets:
    - cifake
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - cifake_test

aug:
  online: false

optim:
  epochs: 5
  batch_size: 64
  head_batch_size: 8192
  cache_features: true
  lr: 0.001
  num_workers: 8

gpu: "1"
# end
