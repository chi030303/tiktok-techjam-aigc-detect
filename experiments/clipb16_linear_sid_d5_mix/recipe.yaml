# 2026-08-31, tianqi, D5: SID + D3 mix + D4 new T2I (no Hunyuan)
name: clipb16_linear_sid_d5_mix
description: DATA_ABLATION_PLAN D5. D3 ∪ D4. Full SID, drop equal FLUX. Frozen CLIP-B + online aug.
owner: kiki

backbone: clip-vit-base-patch16
head: linear
freeze_backbone: true
input_mode: rgb

train:
  datasets:
    - sid_set
  mixin_manifest: data/manifests/ablation/D5_sid_mixin.jsonl
  replace_sid_fakes: true
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val
  - evalgen

aug:
  online: true
  jpeg: true
  blur: true
  resize: true
  noise: true
  jitter: true
  center_crop: true

optim:
  epochs: 3
  batch_size: 64
  lr: 0.001
  num_workers: 4
  cache_features: false
  seed: 20260831

gpu: "1"
# end
