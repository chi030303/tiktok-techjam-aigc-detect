# 2026-08-29, yun, CIFAKE full run: all 100k train / 20k test, frozen CLIP ViT-B/16 + linear head
name: clipb16_linear_cifake_full
description: Full CIFAKE train/test split, frozen CLIP ViT-B/16 + linear head.
owner: yun

backbone: clip-vit-base-patch16
head: linear
freeze_backbone: true

train:
  datasets:
    - cifake
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - cifake_test

smoke:
  max_train: 100000
  max_eval: 20000
  seed: 0

aug:
  jpeg: false
  blur: false
  resize: true
  noise: false
  jitter: false
  center_crop: false

optim:
  epochs: 3
  batch_size: 256
  lr: 0.001

gpu: "1"
# end
