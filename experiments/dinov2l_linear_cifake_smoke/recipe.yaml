# 2026-08-29, tianqi, CIFAKE smoke: 400 images, frozen DINOv2-L + linear head
name: dinov2l_linear_cifake_smoke
description: Smoke run on CIFAKE (200-500 images), frozen DINOv2 ViT-L/14 + linear head.
owner: kiki

backbone: dinov2-vit-large-patch14
head: linear
freeze_backbone: true

train:
  datasets:
    - cifake
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - cifake_test

smoke:
  max_train: 400
  max_eval: 200
  seed: 0

aug:
  jpeg: false
  blur: false
  resize: true
  noise: false
  jitter: false
  center_crop: false

optim:
  epochs: 3
  batch_size: 16
  lr: 0.001

gpu: "1"
# end
