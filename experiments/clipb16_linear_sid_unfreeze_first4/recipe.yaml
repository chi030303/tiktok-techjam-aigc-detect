# 2026-08-31, tianqi, first-4 encoder blocks vs last-4 unfreeze (same SID+aug as unfreeze4)
name: clipb16_linear_sid_unfreeze_first4
description: SID 14万 + online aug, unfreeze CLIP-B encoder blocks 0-3 (not last-4, not D3).
owner: kiki

backbone: clip-vit-base-patch16
head: linear
freeze_backbone: false
input_mode: rgb

partial_unfreeze:
  n_layers: 4
  unfreeze_from: first
  backbone_lr: 0.00001
  head_lr: 0.001

train:
  datasets:
    - sid_set
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val
  - evalgen

aug:
  online: true
  jpeg: true
  blur: true
  resize: true
  noise: true
  jitter: true
  center_crop: true

optim:
  epochs: 3
  batch_size: 64
  num_workers: 4
  seed: 20260831

gpu: "1"
# end
