# 2026-08-29, tianqi, SID_Set real vs full-synthetic, online random official aug, drop tampered
name: resnet50_linear_sid_aug
description: SID_Set (label 0/1 only), frozen ResNet-50, online random 6-op aug.
owner: kiki

backbone: resnet-50
head: linear
freeze_backbone: true
input_mode: rgb

train:
  datasets:
    - sid_set
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val

aug:
  online: true
  jpeg: true
  blur: true
  resize: true
  noise: true
  jitter: true
  center_crop: true

optim:
  epochs: 3
  batch_size: 64
  lr: 0.001
  num_workers: 4
  cache_features: false

gpu: "1"
# end
