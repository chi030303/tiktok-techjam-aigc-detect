# 2026-08-31, tianqi, A1 t2i-only = D2 8k-probe, named for A-axis table
name: clipb16_linear_A1_t2i_only
description: >
  DATA_ABLATION_PLAN A1. Same 8k SID reals as D1 + self-built t2i fakes only
  (no i2i). Frozen CLIP-B linear, no online aug. Compare to A2/A3.
owner: kiki

backbone: clip-vit-base-patch16
head: linear
freeze_backbone: true
input_mode: rgb

train:
  datasets:
    - manifest
  manifest: data/manifests/ablation/D2_selfbuilt.jsonl
  eval_manifest: data/manifests/source_sid_val.jsonl
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val
  - evalgen

aug:
  online: false

optim:
  epochs: 3
  batch_size: 64
  lr: 0.001
  num_workers: 4
  cache_features: true
  seed: 20260831

gpu: "1"
# end
