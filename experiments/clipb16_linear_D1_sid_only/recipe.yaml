# 2026-08-30, tianqi, D1 SID-only 8k+8k frozen CLIP-B linear (feat cache, no online aug)
name: clipb16_linear_D1_sid_only
description: DATA_ABLATION_PLAN D1. Manifest 8k SID real + 8k FLUX t2i. Frozen CLIP-B linear.
owner: kiki

backbone: clip-vit-base-patch16
head: linear
freeze_backbone: true
input_mode: rgb

train:
  datasets:
    - manifest
  manifest: data/manifests/ablation/D1_sid_only.jsonl
  eval_manifest: data/manifests/source_sid_val.jsonl
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val
  - evalgen

aug:
  online: false

optim:
  epochs: 3
  batch_size: 64
  lr: 0.001
  num_workers: 4
  cache_features: true
  seed: 20260830

gpu: "0"
# end
