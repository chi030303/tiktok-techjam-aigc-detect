# 2026-08-31, tianqi, D2 8k-probe: D1 reals + self-built fakes, frozen CLIP-B, no aug
name: clipb16_linear_D2_selfbuilt
description: DATA_ABLATION_PLAN D2. Same 8k SID reals as D1, ~6k self-built t2i. Frozen CLIP-B linear.
owner: kiki

backbone: clip-vit-base-patch16
head: linear
freeze_backbone: true
input_mode: rgb

train:
  datasets:
    - manifest
  manifest: data/manifests/ablation/D2_selfbuilt.jsonl
  eval_manifest: data/manifests/source_sid_val.jsonl
  forbid:
    - val
    - evalgen
    - demo_wildfake

eval:
  - official_val
  - evalgen

aug:
  online: false

optim:
  epochs: 3
  batch_size: 64
  lr: 0.001
  num_workers: 4
  cache_features: true
  seed: 20260831

gpu: "1"
# end
